# Weekly: merge cenodude/CrossWatch, translate new UI strings, publish a release.
# Fork addition; the original workflows of the project are manual-only and unused here.
name: Fork sync and release

on:
  schedule:
    - cron: "0 1 * * 6"   # Saturday 01:00 UTC (night Friday to Saturday)
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish a release even without changes"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/cenodude/CrossWatch.git
  PYTHON_VERSION: "3.13"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A token with workflow scope is only needed when upstream changes its workflows.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only official releases of the original are merged, never its development branch.
          TAG=$(gh api repos/cenodude/CrossWatch/releases/latest -q .tag_name)
          echo "Latest release of the original: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --no-tags upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
          REF="upstream-$TAG"
          BEHIND=$(git rev-list --count HEAD.."$REF")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then echo "Up to date with $TAG"; exit 0; fi
          if ! git merge --no-edit -m "Original $TAG eingespielt ($BEHIND Commits)" "$REF"; then
            FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Abgleich mit dem Original: Merge-Konflikt" \
              --assignee "${{ github.repository_owner }}" \
              --body "Der wöchentliche Abgleich mit cenodude/CrossWatch $TAG ($BEHIND neue Commits) ist an Konflikten gescheitert:

          $FILES

          Bitte von Hand zusammenführen." || true
            exit 1
          fi

      - name: Translate new UI strings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MISSING=$(python tools/i18n/extract.py --missing de 2>&1 >/dev/null | grep -o '^[0-9]*')
          echo "Missing translations: $MISSING"
          if [ "$MISSING" != "0" ]; then
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              pip install --quiet anthropic
              python tools/i18n/translate.py de
            else
              # The issue is assigned to the owner so GitHub sends a mail;
              # an open issue is updated, not duplicated.
              python tools/i18n/extract.py --missing de > missing.txt 2>/dev/null
              {
                echo "Ohne ANTHROPIC_API_KEY konnten diese $MISSING Texte nicht automatisch übersetzt werden (Original ${{ steps.merge.outputs.tag }}). Sie erscheinen in der Oberfläche auf Englisch, bis sie in \`assets/i18n/de.js\` ergänzt sind."
                echo
                echo '```'
                head -c 60000 missing.txt
                echo '```'
              } > issue.md
              OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Übersetzung in:title" --json number -q '.[0].number')
              if [ -n "$OPEN" ]; then
                gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --title "Übersetzung: $MISSING neue Texte" --body-file issue.md || true
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Neuer Stand nach dem Abgleich: $MISSING Texte offen." || true
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "Übersetzung: $MISSING neue Texte" \
                  --assignee "${{ github.repository_owner }}" --body-file issue.md || true
              fi
            fi
          fi
          python tools/i18n/extract.py
          git add assets/i18n tools/i18n
          git diff --cached --quiet || git commit -q -m "Übersetzung: neue Texte ergänzt"

      - name: Smoke test
        run: |
          pip install --quiet -r requirements.txt httpx2
          # The app writes provider state below /config, as in its Docker image.
          sudo install -d -o "$USER" /config
          export CONFIG_BASE=/config
          python - <<'EOF'
          from fastapi.testclient import TestClient
          import crosswatch
          c = TestClient(crosswatch.app)
          r = c.get("/", headers={"accept-language": "de"})
          assert r.status_code == 200 and "/assets/i18n/i18n.js" in r.text, r.status_code
          assert c.get("/assets/i18n/de.js").status_code == 200
          print("smoke test ok")
          EOF

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git push origin HEAD:main 2> push.err; then
            cat push.err
            if grep -q "workflows. permission" push.err; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Abgleich mit dem Original: Secret SYNC_TOKEN fehlt" --assignee "${{ github.repository_owner }}"                 --body "Das Original hat eine Workflow-Datei geändert. Das Standard-Token darf solche Änderungen nicht pushen.

          Abhilfe: ein Token mit den Rechten *Contents* und *Workflows* für dieses Repo als Secret \`SYNC_TOKEN\` hinterlegen und den Workflow erneut starten." || true
            fi
            exit 1
          fi

      - name: Decide on a release
        id: decide
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*.post*' 2>/dev/null || echo "")
          if [ -z "$LAST" ] || [ -n "$(git log --oneline "$LAST"..HEAD)" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        if: steps.decide.outputs.release == 'yes'
        id: build
        run: |
          BASE=$(python -c "import re;print(re.search(r'FALLBACK_VERSION = \"v?([^\"]+)\"', open('cw_platform/app_version.py').read()).group(1))")
          # The number of the merged release wins over the code, which may already name the next version.
          UP="${{ steps.merge.outputs.tag }}"
          [ -n "$UP" ] && BASE="${UP#v}"
          TAG="v${BASE}.post$(date -u +%Y%m%d%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          pip install --quiet uv
          uv pip compile requirements.txt --generate-hashes --python-version "$PYTHON_VERSION" \
            --python-platform x86_64-manylinux_2_28 --quiet -o requirements.lock
          mkdir -p dist
          git archive --format=tar --prefix="crosswatch-$TAG/" HEAD > "dist/crosswatch-$TAG.tar"
          mkdir -p "stage/crosswatch-$TAG"
          printf '%s' "$TAG" > "stage/crosswatch-$TAG/VERSION"
          cp requirements.lock "stage/crosswatch-$TAG/"
          tar -rf "dist/crosswatch-$TAG.tar" -C stage "crosswatch-$TAG/VERSION" "crosswatch-$TAG/requirements.lock"
          gzip -9 "dist/crosswatch-$TAG.tar"
          (cd dist && sha256sum "crosswatch-$TAG.tar.gz" > "crosswatch-$TAG.tar.gz.sha256")

      - name: Publish release
        if: steps.decide.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          LAST: ${{ steps.decide.outputs.last }}
          UPTAG: ${{ steps.merge.outputs.tag }}
        run: |
          SINCE=${LAST:+^$LAST}
          {
            echo "Wöchentlicher Stand: Original cenodude/CrossWatch $UPTAG mit deutscher Oberfläche und Sicherheits-Ergänzungen."
            echo
            echo "**Aktualisieren:** Glocke in CrossWatch → «Jetzt aktualisieren», oder \`update\` in der Konsole des Containers."
            if [ -n "$LAST" ]; then
              echo
              echo "### Neu im Original (bis $UPTAG)"
              git log --no-merges --format='- %s ([%h](https://github.com/cenodude/CrossWatch/commit/%H))' "upstream-$UPTAG" $SINCE | head -80
            fi
            echo
            echo "### Neu im Fork"
            git log --no-merges --format='- %s' HEAD $SINCE ^"upstream-$UPTAG" | head -40
          } > notes.md
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" dist/* --title "CrossWatch $TAG" --notes-file notes.md
